name: CI

on:
  push:
  pull_request:

jobs:
  producer:
    name: Producer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mesh-builder
    env:
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mesh-builder/requirements.txt
      - name: Install exact producer dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Complete producer test suite
        run: python -m pytest -q
      - name: Verify producer source binding
        run: python -c 'from pathlib import Path; from common.source_binding import PRODUCER_SCOPE, verify_binding; print(verify_binding(Path.cwd(), PRODUCER_SCOPE))'

  import-probe:
    name: Import Probe
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: import-probe
    env:
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: import-probe/requirements.txt
      - name: Install exact Import Probe dependencies
        run: |
          unset PYTHONPATH
          python -m pip install --requirement requirements.txt
      - name: Ruff
        run: |
          unset PYTHONPATH
          ruff check .
      - name: Complete Import Probe test suite
        run: |
          unset PYTHONPATH
          python -m pytest -q
      - name: Verify Import Probe source binding
        run: |
          unset PYTHONPATH
          python -c 'from pathlib import Path; from probe.source_binding import verify_binding; print(verify_binding(Path.cwd()))'
      - name: Verify producer modules are not imported
        run: |
          unset PYTHONPATH
          python -c 'from pathlib import Path; forbidden=("from app", "import app", "from common", "import common"); matches=[f"{path}:{token}" for path in sorted(Path("probe").rglob("*.py")) for token in forbidden if token in path.read_text(encoding="utf-8")]; assert not matches, matches; print("Import Probe contains no producer app/common imports")'
